# Local development infrastructure for the Vietnamese Family Tree API.
#
# Starts PostgreSQL 16, Redis, optional MinIO (--profile storage), and the Spring Boot API.
#
#   docker compose up -d --build    # start everything, including the Java API
#   docker compose up -d db redis   # infrastructure only (then run the host JAR)
#   docker compose ps               # check health
#   docker compose down             # stop (keeps the named volume / data)
#   docker compose down -v          # stop and delete the data volume
#
# Nested overlayfs Docker often cannot start these containers. Use a host
# Postgres 16 + Redis 7 and the JAR path in README.md instead.
#
# Point a host-run JAR at the database with:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/familytree
#   SPRING_DATASOURCE_USERNAME=familytree
#   SPRING_DATASOURCE_PASSWORD=familytree
services:
  db:
    image: postgres:16-alpine
    container_name: caygiapha-db
    environment:
      POSTGRES_DB: familytree
      POSTGRES_USER: familytree
      POSTGRES_PASSWORD: familytree
    ports:
      - "5432:5432"
    volumes:
      - caygiapha-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familytree -d familytree"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for person photos (Requirement 24.7). The backend's StorageService
  # talks to any S3-compatible endpoint; in production this is a managed bucket, locally it is MinIO.
  #   Console: http://localhost:9001  (user/password: familytree / familytree)
  #   API:     http://localhost:9000
  minio:
    image: minio/minio:latest
    container_name: caygiapha-minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: familytree
      MINIO_ROOT_PASSWORD: familytree
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - caygiapha-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: caygiapha-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: caygiapha-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/familytree
      SPRING_DATASOURCE_USERNAME: familytree
      SPRING_DATASOURCE_PASSWORD: familytree
      SPRING_DATA_REDIS_HOST: redis
      APP_DEMO_SEED: "true"
      APP_JWT_SECRET: local-dev-only-change-me-use-32b-min-secret
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  caygiapha-pgdata:
  caygiapha-minio:
