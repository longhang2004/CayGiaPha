# Test profile.
#
# Integration tests obtain their PostgreSQL DataSource from a Testcontainers container wired
# via @ServiceConnection (see TestcontainersConfiguration), so no JDBC URL is set here.
# Flyway runs the migrations against the container before tests execute.
spring:
  jpa:
    show-sql: false
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app:
  demo:
    seed: false
  jwt:
    secret: test-only-jwt-hmac-secret-32bytes-min
