# Local development profile.
#
# Run the app locally against Postgres 16 + Redis 7 (host installs, or
# `docker compose up -d db redis` when the daemon can start containers):
#   SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/familytree \
#   SPRING_DATASOURCE_USERNAME=familytree \
#   SPRING_DATASOURCE_PASSWORD=familytree \
#   APP_DEMO_SEED=true \
#   mvn spring-boot:run
#
# Or use Testcontainers via TestFamilyTreeApiApplication.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/familytree}
    username: ${SPRING_DATASOURCE_USERNAME:familytree}
    password: ${SPRING_DATASOURCE_PASSWORD:familytree}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  demo:
    seed: ${APP_DEMO_SEED:false}

logging:
  level:
    com.caygiapha.familytree: DEBUG
    org.flywaydb: INFO
