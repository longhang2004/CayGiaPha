spring:
  application:
    name: family-tree-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
  data:
    redis:
      repositories:
        enabled: false
  profiles:
    # Default to the local profile for development; override with SPRING_PROFILES_ACTIVE.
    default: local
  jpa:
    # Flyway owns the schema; Hibernate only validates entity mappings against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${EMAIL_HOST:}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: ${EMAIL_SMTP_AUTH:true}
          starttls:
            enable: ${EMAIL_SMTP_STARTTLS:true}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING:1.0}
  observations:
    key-values:
      application: family-tree-api

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
    tags-sorter: alpha
  show-actuator: false

resilience4j:
  circuitbreaker:
    instances:
      outboundEmail:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
      outboundGoogle:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      outboundEmail:
        maxAttempts: 3
        waitDuration: 200ms
      outboundGoogle:
        maxAttempts: 2
        waitDuration: 150ms
  timelimiter:
    instances:
      outboundEmail:
        timeoutDuration: 8s
      outboundGoogle:
        timeoutDuration: 5s

logging:
  level:
    com.caygiapha.familytree: INFO
    # Never raise auth/otp packages to TRACE in shared logs.

app:
  storage:
    type: ${APP_STORAGE_TYPE:filesystem}
  cloudinary:
    url: ${CLOUDINARY_URL:}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  security:
    # Comma-separated browser origins allowed for credentialed mutating requests (CSRF Origin check).
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  mail:
    enabled: ${EMAIL_ENABLED:false}
    # Set false on cloud BE hosts that block SMTP; frontend will send invite emails instead.
    smtp-enabled: ${EMAIL_SMTP_ENABLED:true}
    from: ${EMAIL_FROM:${EMAIL_USER:}}
  app-url: ${APP_PUBLIC_URL:http://localhost:3000}
  demo:
    seed: ${APP_DEMO_SEED:false}
    email: ${APP_DEMO_EMAIL:seed@caygiapha.local}
    # Documented local-only password. Override in real environments; never a production secret.
    password: ${APP_DEMO_PASSWORD:SeedFamily-2026!}
  jwt:
    issuer: ${APP_JWT_ISSUER:caygiapha-family-tree-api}
    secret: ${APP_JWT_SECRET:local-dev-only-change-me-use-32b-min-secret}
    ttl-seconds: ${APP_JWT_TTL_SECONDS:3600}
  kinship-cache:
    ttl-seconds: ${APP_KINSHIP_CACHE_TTL_SECONDS:120}

# Optional: RESEND_API_KEY (HTTPS email). Preferred when cloud hosts block SMTP.
