spring:
  application:
    name: family-tree-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
  data:
    redis:
      repositories:
        enabled: false
  profiles:
    # Default to the local profile for development; override with SPRING_PROFILES_ACTIVE.
    default: local
  jpa:
    # Flyway owns the schema; Hibernate only validates entity mappings against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${EMAIL_HOST:}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: ${EMAIL_SMTP_AUTH:true}
          starttls:
            enable: ${EMAIL_SMTP_STARTTLS:true}

server:
  port: ${PORT:8080}

logging:
  level:
    com.caygiapha.familytree: INFO

app:
  storage:
    type: ${APP_STORAGE_TYPE:filesystem}
  cloudinary:
    url: ${CLOUDINARY_URL:}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  security:
    # Comma-separated browser origins allowed for credentialed mutating requests (CSRF Origin check).
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  mail:
    enabled: ${EMAIL_ENABLED:false}
    # Set false on cloud BE hosts that block SMTP; frontend will send invite emails instead.
    smtp-enabled: ${EMAIL_SMTP_ENABLED:true}
    from: ${EMAIL_FROM:${EMAIL_USER:}}
  app-url: ${APP_PUBLIC_URL:http://localhost:3000}

# Optional: RESEND_API_KEY (HTTPS email). Preferred when cloud hosts block SMTP.
