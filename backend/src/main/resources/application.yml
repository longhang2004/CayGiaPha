spring:
  application:
    name: family-tree-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
  data:
    redis:
      repositories:
        enabled: false
  profiles:
    # Default to the local profile for development; override with SPRING_PROFILES_ACTIVE.
    default: local
  jpa:
    # Flyway owns the schema; Hibernate only validates entity mappings against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

logging:
  level:
    com.caygiapha.familytree: INFO

app:
  storage:
    type: ${APP_STORAGE_TYPE:filesystem}
  cloudinary:
    url: ${CLOUDINARY_URL:}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
