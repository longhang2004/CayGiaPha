<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#f3eee6"/>
  <rect x="0" y="0" width="248" height="900" fill="#fff" stroke="#ded7cd"/>
  <text x="38" y="60" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#22201d">Cây Gia Phả</text>
  <rect x="22" y="112" width="204" height="52" rx="10" fill="#e8f0e9"/>
  <text x="42" y="145" font-family="Arial, sans-serif" font-size="15" fill="#22201d">Danh sách cây</text>
  <text x="42" y="212" font-family="Arial, sans-serif" font-size="15" fill="#5d5a53">Trợ giúp</text>
  <text x="42" y="260" font-family="Arial, sans-serif" font-size="15" fill="#5d5a53">Cài đặt</text>

  <text x="308" y="88" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#b94b34">KHÔNG GIAN GIA ĐÌNH</text>
  <text x="308" y="137" font-family="Arial, sans-serif" font-size="42" font-weight="500" fill="#b94b34">Cây gia phả của bạn</text>
  <text x="308" y="173" font-family="Arial, sans-serif" font-size="17" fill="#666159">Quản lý những cây bạn sở hữu hoặc đang cộng tác.</text>
  <rect x="1160" y="98" width="208" height="52" rx="26" fill="#b94b34"/>
  <text x="1207" y="131" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">+ Tạo cây mới</text>

  <rect x="308" y="220" width="930" height="340" rx="22" fill="#fff" stroke="#d9d1c6"/>
  <text x="344" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#b94b34">BẮT ĐẦU</text>
  <text x="344" y="302" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#22201d">Bắt đầu theo cách của bạn</text>
  <text x="344" y="336" font-family="Arial, sans-serif" font-size="16" fill="#666159">Làm từng bước khi thuận tiện. Bạn có thể để sau và mở lại bất cứ lúc nào.</text>
  <text x="1072" y="265" font-family="Arial, sans-serif" font-size="14" fill="#666159">1 trong 5 bước đã xong</text>
  <rect x="344" y="365" width="850" height="8" rx="4" fill="#eee8df"/>
  <rect x="344" y="365" width="170" height="8" rx="4" fill="#b94b34"/>

  <circle cx="366" cy="421" r="15" fill="#e8f0e9" stroke="#5e8368"/>
  <path d="M359 421l5 5 9-11" fill="none" stroke="#43634b" stroke-width="2"/>
  <text x="398" y="427" font-family="Arial, sans-serif" font-size="17" fill="#555149">Tạo hoặc mở một cây</text>
  <circle cx="366" cy="471" r="15" fill="#fff" stroke="#b94b34" stroke-width="2"/>
  <text x="361" y="477" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#b94b34">2</text>
  <text x="398" y="466" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#22201d">Thêm người đầu tiên</text>
  <text x="398" y="490" font-family="Arial, sans-serif" font-size="14" fill="#666159">Bắt đầu với chính bạn hoặc một người thân.</text>
  <rect x="1015" y="445" width="179" height="48" rx="24" fill="#b94b34"/>
  <text x="1061" y="475" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Làm bước này</text>
  <text x="344" y="535" font-family="Arial, sans-serif" font-size="14" fill="#777169">Thu gọn</text>
  <text x="1117" y="535" font-family="Arial, sans-serif" font-size="14" fill="#777169">Để sau</text>

  <rect x="308" y="610" width="450" height="186" rx="18" fill="#fff" stroke="#ddd5ca"/>
  <text x="338" y="652" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#22201d">Gia phả dòng họ</text>
  <text x="338" y="687" font-family="Arial, sans-serif" font-size="15" fill="#666159">Vai trò: Chủ cây · Vùng: Bắc</text>
  <rect x="338" y="724" width="136" height="46" rx="23" fill="#b94b34"/>
  <text x="371" y="753" font-family="Arial, sans-serif" font-size="15" fill="#fff">Xem sơ đồ</text>

  <path d="M1260 340 L1340 340" stroke="#b94b34" stroke-width="2"/>
  <circle cx="1355" cy="340" r="14" fill="#b94b34"/>
  <text x="1350" y="346" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="1265" y="385" font-family="Arial, sans-serif" font-size="13" fill="#5d5a53">Inline, không scrim:</text>
  <text x="1265" y="407" font-family="Arial, sans-serif" font-size="13" fill="#5d5a53">tác vụ chính vẫn dùng được.</text>
  <circle cx="1260" cy="487" r="14" fill="#b94b34"/>
  <text x="1255" y="493" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="1265" y="532" font-family="Arial, sans-serif" font-size="13" fill="#5d5a53">Chỉ hiện bước đủ điều kiện;</text>
  <text x="1265" y="554" font-family="Arial, sans-serif" font-size="13" fill="#5d5a53">không liệt kê việc bị khóa.</text>
</svg>
