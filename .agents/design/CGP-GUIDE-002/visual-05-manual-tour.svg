<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <defs><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b8176"/></marker></defs>
  <rect width="1440" height="920" fill="#f5f0e8"/>
  <text x="60" y="66" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1.5" fill="#b94b34">MANUAL `CHỈ TÔI` TOUR</text>
  <text x="60" y="110" font-family="Arial" font-size="34" font-weight="700" fill="#25221f">Một goal, tối đa ba target cần thiết, không bao giờ auto-run</text>

  <rect x="60" y="180" width="380" height="560" rx="24" fill="#fff" stroke="#d8d0c6"/>
  <text x="90" y="220" font-family="Arial" font-size="12" font-weight="700" fill="#b94b34">1 · EXPLICIT ENTRY</text>
  <text x="90" y="259" font-family="Arial" font-size="24" font-weight="700" fill="#25221f">Nối một quan hệ gần</text>
  <text x="90" y="292" font-family="Arial" font-size="14" fill="#666058">Thêm cha, mẹ, vợ/chồng hoặc con.</text>
  <rect x="90" y="335" width="160" height="50" rx="25" fill="#b94b34"/><text x="121" y="366" font-family="Arial" font-size="14" font-weight="700" fill="#fff">Làm bước này</text>
  <rect x="266" y="335" width="116" height="50" rx="25" fill="#fff" stroke="#b94b34"/><text x="295" y="366" font-family="Arial" font-size="14" font-weight="700" fill="#b94b34">Chỉ tôi</text>
  <text x="90" y="430" font-family="Arial" font-size="14" fill="#b94b34">Xem cách làm</text>
  <line x1="90" y1="465" x2="410" y2="465" stroke="#e7e0d7"/>
  <text x="90" y="505" font-family="Arial" font-size="15" font-weight="700" fill="#25221f">`Chỉ tôi` chỉ thuộc item này.</text>
  <text x="90" y="533" font-family="Arial" font-size="14" fill="#666058">Không nối sang search, privacy, cộng tác</text>
  <text x="90" y="555" font-family="Arial" font-size="14" fill="#666058">hoặc feature khác.</text>
  <text x="90" y="622" font-family="Arial" font-size="14" fill="#777068">Xem/đóng tour không complete hoặc defer.</text>

  <rect x="530" y="180" width="380" height="560" rx="24" fill="#e9edef" stroke="#d8d0c6"/>
  <text x="560" y="220" font-family="Arial" font-size="12" font-weight="700" fill="#b94b34">2 · GOAL TOUR RUNNING</text>
  <g stroke="#8c9891" stroke-width="2" fill="none"><path d="M720 335V390H640V440 M720 390H800V440"/></g>
  <rect x="660" y="282" width="120" height="54" rx="12" fill="#fff" stroke="#6f91b4"/><text x="720" y="315" text-anchor="middle" font-family="Arial" font-size="13" fill="#25221f">Nguyễn Minh</text>
  <rect x="580" y="440" width="120" height="54" rx="12" fill="#fff" stroke="#c27e91"/><text x="640" y="473" text-anchor="middle" font-family="Arial" font-size="13" fill="#25221f">Trần Hoa</text>
  <rect x="740" y="440" width="120" height="54" rx="12" fill="#fff" stroke="#6f91b4"/><text x="800" y="473" text-anchor="middle" font-family="Arial" font-size="13" fill="#25221f">Nguyễn Bình</text>
  <rect x="566" y="426" width="148" height="82" rx="15" fill="none" stroke="#b94b34" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="555" y="540" width="330" height="165" rx="18" fill="#fff" stroke="#b94b34" stroke-width="2"/>
  <text x="580" y="574" font-family="Arial" font-size="12" font-weight="700" fill="#b94b34">CHỈ DẪN NHANH · 1/2</text>
  <text x="580" y="609" font-family="Arial" font-size="20" font-weight="700" fill="#25221f">Chọn người cần nối quan hệ</text>
  <text x="580" y="640" font-family="Arial" font-size="14" fill="#666058">Sau đó, chọn “Thêm quan hệ” trong bảng thông tin.</text>
  <text x="580" y="680" font-family="Arial" font-size="14" fill="#777068">Dừng hướng dẫn</text>
  <rect x="786" y="655" width="76" height="42" rx="21" fill="#b94b34"/><text x="810" y="681" font-family="Arial" font-size="13" fill="#fff">Tiếp</text>

  <rect x="1000" y="180" width="380" height="560" rx="24" fill="#fff" stroke="#d8d0c6"/>
  <text x="1030" y="220" font-family="Arial" font-size="12" font-weight="700" fill="#b94b34">3 · SAFE RECOVERY</text>
  <text x="1030" y="260" font-family="Arial" font-size="22" font-weight="700" fill="#25221f">Target không còn khả dụng</text>
  <rect x="1030" y="304" width="320" height="176" rx="16" fill="#f4f1ec"/>
  <text x="1055" y="341" font-family="Arial" font-size="15" font-weight="700" fill="#25221f">Không tìm thấy điều khiển này</text>
  <text x="1055" y="371" font-family="Arial" font-size="14" fill="#666058">Vị trí hoặc quyền của bạn vừa thay đổi.</text>
  <text x="1055" y="397" font-family="Arial" font-size="14" fill="#666058">Không có tooltip nào trỏ vào control khác.</text>
  <text x="1055" y="444" font-family="Arial" font-size="14" fill="#b94b34">Mở hướng dẫn chi tiết</text>
  <rect x="1030" y="520" width="184" height="48" rx="24" fill="#fff" stroke="#b94b34"/><text x="1054" y="550" font-family="Arial" font-size="14" fill="#b94b34">Quay lại bước bắt đầu</text>
  <text x="1030" y="625" font-family="Arial" font-size="14" font-weight="700" fill="#25221f">Recovery by state</text>
  <text x="1030" y="655" font-family="Arial" font-size="13" fill="#666058">Offscreen → explicit “Đưa tôi tới vị trí”</text>
  <text x="1030" y="678" font-family="Arial" font-size="13" fill="#666058">Disabled → prerequisite, no highlight</text>
  <text x="1030" y="701" font-family="Arial" font-size="13" fill="#666058">Ineligible → stop without revealing action</text>

  <g stroke="#8b8176" stroke-width="2" fill="none" marker-end="url(#arrow2)"><path d="M440 450H522"/><path d="M910 450H992"/></g>
  <text x="455" y="438" font-family="Arial" font-size="13" fill="#6d665e">User selects Chỉ tôi</text>
  <text x="925" y="438" font-family="Arial" font-size="13" fill="#6d665e">Target changes</text>

  <rect x="60" y="790" width="1320" height="78" rx="16" fill="#fff" stroke="#ddd5cb"/>
  <text x="88" y="822" font-family="Arial" font-size="16" font-weight="700" fill="#25221f">Cancel/finish returns focus and presentation state.</text>
  <text x="88" y="849" font-family="Arial" font-size="14" fill="#666058">Checklist remains incomplete until the product outcome is confirmed; manual replay remains available.</text>
</svg>
