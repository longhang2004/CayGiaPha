<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b8176"/></marker></defs>
  <rect width="1440" height="900" fill="#f5f0e8"/>
  <text x="72" y="76" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1.5" fill="#b94b34">CGP-GUIDE-002 · LIFECYCLE</text>
  <text x="72" y="124" font-family="Arial" font-size="36" font-weight="700" fill="#25221f">Một outcome, nhiều presentation state rõ nghĩa</text>
  <text x="72" y="158" font-family="Arial" font-size="16" fill="#666058">Product outcome và trạng thái hiển thị hướng dẫn luôn độc lập.</text>

  <g font-family="Arial">
    <rect x="90" y="240" width="250" height="154" rx="20" fill="#fff" stroke="#d7cec2"/>
    <text x="118" y="276" font-size="12" font-weight="700" fill="#b94b34">INCOMPLETE</text>
    <text x="118" y="310" font-size="22" font-weight="700" fill="#25221f">Checklist đang mở</text>
    <text x="118" y="341" font-size="14" fill="#666058">Làm bước này · Chỉ tôi</text>
    <text x="118" y="366" font-size="14" fill="#666058">Xem cách làm</text>

    <rect x="440" y="240" width="250" height="154" rx="20" fill="#fff" stroke="#d7cec2"/>
    <text x="468" y="276" font-size="12" font-weight="700" fill="#b94b34">CURRENT VISIT</text>
    <text x="468" y="310" font-size="22" font-weight="700" fill="#25221f">Launcher thu gọn</text>
    <text x="468" y="341" font-size="14" fill="#666058">Bước tiếp theo: …</text>
    <text x="468" y="366" font-size="14" fill="#666058">Mở hướng dẫn</text>

    <rect x="790" y="240" width="250" height="154" rx="20" fill="#fff" stroke="#d7cec2" stroke-dasharray="6 5"/>
    <text x="818" y="276" font-size="12" font-weight="700" fill="#777068">CURRENT VISIT</text>
    <text x="818" y="310" font-size="22" font-weight="700" fill="#25221f">Để sau</text>
    <text x="818" y="341" font-size="14" fill="#666058">Không auto card/launcher.</text>
    <text x="818" y="366" font-size="14" fill="#666058">Explicit reopen vẫn dùng được.</text>

    <rect x="1120" y="240" width="250" height="154" rx="20" fill="#fff" stroke="#d7cec2"/>
    <text x="1148" y="276" font-size="12" font-weight="700" fill="#b94b34">EXPLICIT</text>
    <text x="1148" y="310" font-size="22" font-weight="700" fill="#25221f">Review / reopen</text>
    <text x="1148" y="341" font-size="14" fill="#666058">Xem current progress.</text>
    <text x="1148" y="366" font-size="14" fill="#666058">Không reset, không auto tour.</text>
  </g>

  <g stroke="#8b8176" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M340 292H432"/><path d="M690 340H782"/><path d="M1040 340H1112"/>
  </g>
  <text x="362" y="280" font-family="Arial" font-size="13" fill="#6d665e">Thu gọn</text>
  <text x="704" y="328" font-family="Arial" font-size="13" fill="#6d665e">Để sau</text>
  <text x="1050" y="328" font-family="Arial" font-size="13" fill="#6d665e">Help/Hướng dẫn</text>

  <rect x="255" y="520" width="310" height="154" rx="20" fill="#fff9f6" stroke="#b94b34" stroke-width="2"/>
  <text x="285" y="558" font-family="Arial" font-size="12" font-weight="700" fill="#b94b34">FINAL OUTCOME CONFIRMED</text>
  <text x="285" y="596" font-family="Arial" font-size="23" font-weight="700" fill="#25221f">Announcement một lần</text>
  <text x="285" y="630" font-family="Arial" font-size="14" fill="#666058">“Bạn đã hoàn thành các bước bắt đầu.</text>
  <text x="285" y="653" font-family="Arial" font-size="14" fill="#666058">Bạn có thể xem lại trong Trợ giúp.”</text>

  <rect x="660" y="520" width="310" height="154" rx="20" fill="#fff" stroke="#688070" stroke-width="2"/>
  <text x="690" y="558" font-family="Arial" font-size="12" font-weight="700" fill="#4f6b58">RETIRED</text>
  <text x="690" y="596" font-family="Arial" font-size="23" font-weight="700" fill="#25221f">Không còn task-surface UI</text>
  <text x="690" y="630" font-family="Arial" font-size="14" fill="#666058">Không card, launcher, badge hay confetti.</text>
  <text x="690" y="653" font-family="Arial" font-size="14" fill="#666058">Review vẫn có trong Trợ giúp.</text>

  <rect x="1065" y="520" width="310" height="154" rx="20" fill="#fff" stroke="#d7cec2"/>
  <text x="1095" y="558" font-family="Arial" font-size="12" font-weight="700" fill="#777068">HELP / SETTINGS ONLY</text>
  <text x="1095" y="596" font-family="Arial" font-size="23" font-weight="700" fill="#25221f">Đặt lại hướng dẫn</text>
  <text x="1095" y="630" font-family="Arial" font-size="14" fill="#666058">Xóa presentation preferences.</text>
  <text x="1095" y="653" font-family="Arial" font-size="14" fill="#666058">Outcome thật vẫn complete.</text>

  <g stroke="#8b8176" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M340 394L390 512"/><path d="M565 700H652"/><path d="M970 700H1057"/>
  </g>
  <text x="273" y="454" font-family="Arial" font-size="13" fill="#6d665e">Last eligible outcome</text>
  <text x="580" y="724" font-family="Arial" font-size="13" fill="#6d665e">announce → remove</text>
  <text x="982" y="724" font-family="Arial" font-size="13" fill="#6d665e">explicit reset only</text>

  <rect x="90" y="760" width="1280" height="78" rx="16" fill="#fff" stroke="#ddd5cb"/>
  <text x="120" y="792" font-family="Arial" font-size="16" font-weight="700" fill="#25221f">Không action nào trong flow trên tự chạy tour.</text>
  <text x="120" y="819" font-family="Arial" font-size="14" fill="#666058">Tour chỉ bắt đầu sau “Chỉ tôi”; xem tour, Help, collapse, defer và reset không thể complete product item.</text>
</svg>
