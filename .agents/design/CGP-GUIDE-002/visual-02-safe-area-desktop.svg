  <text x="1068" y="590" font-family="Arial" font-size="13" fill="#555">Candidate hợp lệ: không chạm target,</text><text x="1068" y="611" font-family="Arial" font-size="13" fill="#555">info panel, controls hoặc toolbar.</text>
  <circle cx="410" cy="730" r="15" fill="#b94b34"/><text x="405" y="736" font-family="Arial" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="435" y="725" font-family="Arial" font-size="13" fill="#555">Sidebar/header/exclusions dùng actual rendered bounds,</text><text x="435" y="746" font-family="Arial" font-size="13" fill="#555">không dùng top/right/bottom magic offsets.</text>
